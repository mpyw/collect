name: Tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag (e.g., v1.2.3)"
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: "Version to tag (e.g., v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Invalid version format '$VERSION'"
            echo "Expected format: vX.Y.Z (e.g., v1.2.3)"
            exit 1
          fi
          echo "Version format valid: $VERSION"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Go caches a version forever, so a tag is never reused.
      - name: Check tag does not exist
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/${VERSION}$"; then
            echo "Error: Tag '$VERSION' already exists"
            exit 1
          fi
          echo "Tag does not exist: $VERSION"

      # The tag waits for the run that tested this commit, rather than run
      # the tests again.
      - name: Check the commit passed the tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          conclusion=$(gh run list -R "$GITHUB_REPOSITORY" -w test.yml -c "$sha" -L 1 --json conclusion -q '.[0].conclusion')
          if [[ "$conclusion" != success ]]; then
            echo "Error: the tests of $sha concluded '${conclusion:-not run}'"
            exit 1
          fi
          echo "The tests of $sha passed"

      - name: Create and push tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION"
          git push origin "$VERSION"
          echo "Tag '$VERSION' created and pushed successfully"
